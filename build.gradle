buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "http://maven.minecraftforge.net"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
       classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {
           changing = true
       }
    }
}
repositories {
    flatDir {
        dirs "libs"
    }
    maven { name 'CB Maven FS'; url "http://chickenbones.net/maven/" }
}

apply plugin: 'forge'
ext.configFile = file "build.properties"
configFile.withReader {
    // Load config.  It shall from now be referenced as simply config or project.config
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse prop
}
version = "1.2.0"
group= "com.chillrain.chillrainrandomideas" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "ChillRain-Random-Ideas"
targetCompatibility = sourceCompatibility = JavaVersion.VERSION_1_8
minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}
 tasks.withType(JavaCompile) {
     options.encoding = 'UTF-8'
 }

dependencies {

}

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
